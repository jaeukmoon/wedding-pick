<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PERE STUDIO · 웨딩 시안 고르기</title>
<style>
  :root {
    --bg: #faf8f5;
    --ink: #2b2723;
    --muted: #8d857c;
    --line: #e7e1d9;
    --accent: #c2455a;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif KR", "Nanum Myeongjo", Batang, serif;
  }
  header { text-align: center; padding: 44px 16px 10px; }
  header h1 { font-size: 30px; font-weight: 600; letter-spacing: .16em; }
  header p { margin-top: 10px; color: var(--muted); font-size: 14px; letter-spacing: .06em; }
  nav {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: center; gap: 8px;
    padding: 14px 8px 0; margin-top: 18px;
  }
  nav button.tab {
    appearance: none; background: none; border: none;
    border-bottom: 2px solid transparent;
    font: inherit; font-size: 15px; letter-spacing: .04em;
    color: var(--muted); padding: 8px 18px 12px; cursor: pointer;
  }
  nav button.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  nav button.tab .count { font-size: 12px; color: var(--accent); margin-left: 4px; }
  .toolbar {
    max-width: 1400px; margin: 14px auto 0; padding: 0 18px;
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .toolbar button {
    appearance: none; font: inherit; font-size: 12.5px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .toolbar button:hover { color: var(--ink); border-color: #cfc7bc; }
  #sync-status { margin-right: auto; align-self: center; font-size: 12px; color: var(--muted); }
  main { max-width: 1400px; margin: 10px auto 80px; padding: 0 18px; }
  .grid { columns: 4 300px; column-gap: 14px; }
  .card {
    position: relative; display: inline-block; width: 100%;
    margin: 0 0 14px; border-radius: 10px; overflow: hidden;
    background: var(--card); box-shadow: 0 1px 4px rgba(60, 50, 40, .08);
    break-inside: avoid;
  }
  .card .ph { width: 100%; background: #efeae3; position: relative; }
  .card img { display: block; width: 100%; height: 100%; cursor: zoom-in; }
  .card .heart {
    position: absolute; top: 10px; right: 10px; width: 38px; height: 38px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, .88); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
  }
  .heart svg { width: 20px; height: 20px; fill: none; stroke: #a99e93; stroke-width: 2; }
  .card.selected .heart svg, .lb-heart.on svg { fill: var(--accent); stroke: var(--accent); }
  .card.selected::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 3px solid var(--accent); border-radius: 10px;
  }
  .card .note-btn {
    position: absolute; top: 56px; right: 10px; width: 38px; height: 38px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, .88); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
  }
  .note-btn svg { width: 18px; height: 18px; fill: none; stroke: #a99e93; stroke-width: 2; }
  .card.has-note .note-btn svg { stroke: var(--accent); }
  .card .memo {
    padding: 10px 12px 12px; background: #fffdf8;
    border-top: 1px dashed var(--line);
    font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .card .memo .memo-label {
    color: var(--accent); font-size: 10.5px; letter-spacing: .12em; margin-bottom: 3px;
  }
  .card .src {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 22px 12px 8px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .55));
    font-size: 11px; line-height: 1.4; opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  @media (hover: hover) {
    .card:hover .src { opacity: 1; pointer-events: auto; }
  }
  .card .src a { color: #fff; text-decoration: none; }
  .empty { text-align: center; color: var(--muted); padding: 90px 20px; font-size: 15px; line-height: 2; }
  footer { text-align: center; color: var(--muted); font-size: 11.5px; line-height: 1.8; padding: 0 20px 40px; }
  /* password gate */
  #gate {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px;
  }
  #gate h1 { font-size: 26px; letter-spacing: .16em; margin-bottom: 6px; }
  #gate p { color: var(--muted); font-size: 13px; letter-spacing: .04em; }
  #gate input {
    font: inherit; font-size: 16px; text-align: center;
    width: min(280px, 80vw); padding: 10px 14px; margin-top: 14px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    outline: none;
  }
  #gate input:focus { border-color: var(--accent); }
  #gate button {
    font: inherit; font-size: 14px; letter-spacing: .1em;
    padding: 9px 34px; border: none; border-radius: 8px;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  #gate .err { color: var(--accent); font-size: 12.5px; min-height: 16px; }
  /* memo modal */
  #memo-modal {
    position: fixed; inset: 0; z-index: 60; background: rgba(20, 16, 13, .5);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #memo-modal.open { display: flex; }
  .memo-box {
    width: min(480px, 100%); background: var(--bg);
    border-radius: 14px; padding: 20px 20px 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }
  .memo-box h3 { font-size: 15px; font-weight: 600; letter-spacing: .08em; margin-bottom: 12px; }
  .memo-box textarea {
    width: 100%; min-height: 130px; font: inherit; font-size: 14px; line-height: 1.6;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; resize: vertical; outline: none;
  }
  .memo-box textarea:focus { border-color: var(--accent); }
  .memo-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .memo-actions button {
    font: inherit; font-size: 13px; padding: 7px 16px;
    border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
  }
  .memo-actions #memo-save { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* lightbox */
  #lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(20, 16, 13, .96);
    display: none; align-items: center; justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 86vh; border-radius: 4px; }
  .lb-btn {
    position: absolute; appearance: none;
    background: rgba(255, 255, 255, .1); color: #eee; border: none;
    border-radius: 50%; width: 46px; height: 46px; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-btn:hover { background: rgba(255, 255, 255, .22); }
  #lb-close { top: 18px; right: 18px; }
  #lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
  #lb-next { right: 14px; top: 50%; transform: translateY(-50%); }
  .lb-heart { bottom: 22px; left: 50%; transform: translateX(-50%); width: 54px; height: 54px; }
  .lb-heart svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; }
  .lb-note { bottom: 22px; left: calc(50% + 44px); width: 54px; height: 54px; }
  .lb-note svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; }
  .lb-note.on svg { stroke: var(--accent); }
  #lb-info { position: absolute; bottom: 26px; left: 20px; right: 90px; color: #b9b1a8; font-size: 12px; }
  #lb-info a { color: #ddd; }
  #lb-count { position: absolute; top: 28px; left: 22px; color: #b9b1a8; font-size: 13px; letter-spacing: .1em; }
  @media (max-width: 640px) {
    header h1 { font-size: 22px; }
    .grid { columns: 2 150px; column-gap: 8px; }
    .card { margin-bottom: 8px; }
    #lb-info { display: none; }
  }
</style>
</head>
<body>

<div id="gate">
  <h1>PERE STUDIO</h1>
  <p>우리 둘만 보는 시안 갤러리 · 비밀번호를 입력해 주세요</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
  <div class="err" id="pw-err"></div>
  <button id="pw-btn">열기</button>
</div>

<header>
  <h1>PERE STUDIO</h1>
  <p>서울 본점 · 우리 웨딩 촬영 시안 고르기</p>
</header>

<nav>
  <button class="tab active" id="tab-all">전체 사진 <span class="count" id="count-all"></span></button>
  <button class="tab" id="tab-sel">마음에 든 사진 <span class="count" id="count-sel"></span></button>
</nav>

<div class="toolbar">
  <span id="sync-status"></span>
  <button id="btn-export">선택 목록 내보내기</button>
  <button id="btn-clear">전체 선택 해제</button>
</div>

<main><div class="grid" id="grid"></div></main>

<footer>
  사진 출처: 페레 스튜디오 촬영 고객들의 네이버 블로그 후기 (각 사진 위에 마우스를 올리면 원문 링크가 보입니다)<br>
  저작권은 원작자와 스튜디오에 있으며, 두 사람의 시안 참고용 비공개(암호화) 페이지입니다.
</footer>

<div id="memo-modal">
  <div class="memo-box">
    <h3>이 사진에 남길 메모</h3>
    <textarea id="memo-text" placeholder="아이디어, 원하는 포즈나 구도, 참고하고 싶은 점..."></textarea>
    <div class="memo-actions">
      <button id="memo-del">삭제</button>
      <button id="memo-cancel">취소</button>
      <button id="memo-save">저장</button>
    </div>
  </div>
</div>

<div id="lightbox">
  <span id="lb-count"></span>
  <button class="lb-btn" id="lb-close" title="닫기 (Esc)">&times;</button>
  <button class="lb-btn" id="lb-prev" title="이전 (←)">&#8249;</button>
  <button class="lb-btn" id="lb-next" title="다음 (→)">&#8250;</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-heart" id="lb-heart" title="선택/해제 (Enter)">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.2C.6 8.3 2.4 4.5 6 4.1c2-.2 3.9.8 6 3.2 2.1-2.4 4-3.4 6-3.2 3.6.4 5.4 4.2 4 7.7C19.5 16.1 12 21 12 21z"/></svg>
  </button>
  <button class="lb-btn lb-note" id="lb-note" title="메모">
    <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
  </button>
  <div id="lb-info"></div>
</div>

<script>
const HEART_SVG = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.2C.6 8.3 2.4 4.5 6 4.1c2-.2 3.9.8 6 3.2 2.1-2.4 4-3.4 6-3.2 3.6.4 5.4 4.2 4 7.7C19.5 16.1 12 21 12 21z"/></svg>';
const NOTE_SVG = '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
const STATE_KEY = 'pere-state';
const KEY_KEY = 'pere-key';
const SALT_HEX = 'b7a1c9e24d8f3056a2e1907c5b4d6f18';
const ITER = 300000;

const $ = id => document.getElementById(id);

let PHOTOS = [];
let aesKey = null;              // CryptoKey
function loadLocalState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY));
    if (s && s.likes && s.notes) return s;
  } catch {}
  const s = { likes: {}, notes: {} };            // migrate pre-sync per-device format
  const t = Date.now();
  for (const f of JSON.parse(localStorage.getItem('pere-selected') || '[]')) s.likes[f] = { v: 1, t };
  const old = JSON.parse(localStorage.getItem('pere-notes') || '{}');
  for (const f in old) s.notes[f] = { x: old[f], t };
  return s;
}
let state = loadLocalState();
const liked = f => state.likes[f]?.v === 1;
const noteOf = f => (state.notes[f] && state.notes[f].x) || '';
let tab = 'all';
let view = [];
let lbIndex = -1;
const blobUrls = {};            // photo index in PHOTOS -> object URL
const pending = {};

/* ---------- crypto ---------- */
const hexBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));

async function deriveKey(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: hexBytes(SALT_HEX), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function decryptBuf(buf) {
  const b = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, aesKey, b.slice(12));
}

async function tryLoadData() {
  const r = await fetch('data.bin');
  const plain = await decryptBuf(await r.arrayBuffer());   // throws on wrong key
  PHOTOS = JSON.parse(new TextDecoder().decode(plain));
}

async function unlockWith(password) {
  aesKey = await deriveKey(password);
  await tryLoadData();
  const raw = await crypto.subtle.exportKey('raw', aesKey);
  localStorage.setItem(KEY_KEY, btoa(String.fromCharCode(...new Uint8Array(raw))));
}

async function tryStoredKey() {
  const b64 = localStorage.getItem(KEY_KEY);
  if (!b64) return false;
  try {
    const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    aesKey = await crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']);
    await tryLoadData();
    return true;
  } catch { localStorage.removeItem(KEY_KEY); return false; }
}

/* ---------- image decryption on demand ---------- */
function ensureImg(i) {
  if (blobUrls[i]) return Promise.resolve(blobUrls[i]);
  if (!pending[i]) {
    pending[i] = fetch(PHOTOS[i].f)
      .then(r => r.arrayBuffer())
      .then(decryptBuf)
      .then(plain => {
        blobUrls[i] = URL.createObjectURL(new Blob([plain], { type: 'image/jpeg' }));
        return blobUrls[i];
      });
  }
  return pending[i];
}

const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const img = e.target;
    io.unobserve(img);
    ensureImg(+img.dataset.p).then(u => { img.src = u; });
  }
}, { rootMargin: '900px' });

/* ---------- gallery ---------- */
function persist() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

function counts() {
  $('count-all').textContent = PHOTOS.length;
  $('count-sel').textContent = PHOTOS.filter(p => liked(p.f)).length;
}

function toggle(f) {
  state.likes[f] = { v: liked(f) ? 0 : 1, t: Date.now() };
  persist();
  schedulePush();
  counts();
  const card = document.querySelector(`.card[data-f="${CSS.escape(f)}"]`);
  if (card) {
    if (tab === 'sel' && !liked(f)) card.remove();
    else card.classList.toggle('selected', liked(f));
  }
  if (tab === 'sel' && !document.querySelector('.card')) render();
}

function render() {
  view = tab === 'all' ? PHOTOS.map((p, i) => i)
                       : PHOTOS.map((p, i) => i).filter(i => liked(PHOTOS[i].f));
  const grid = $('grid');
  if (!view.length) {
    grid.innerHTML = '<div class="empty">아직 고른 사진이 없어요.<br>전체 사진 탭에서 하트를 눌러 마음에 드는 시안을 담아 보세요.</div>';
    counts();
    return;
  }
  const esc = s => s.replace(/</g, '&lt;');
  grid.innerHTML = view.map((pi, vi) => {
    const p = PHOTOS[pi];
    return `
    <div class="card ${liked(p.f) ? 'selected' : ''}${noteOf(p.f) ? ' has-note' : ''}" data-f="${p.f}">
      <div class="ph" style="aspect-ratio:${p.w}/${p.h}"><img data-p="${pi}" data-v="${vi}" alt="">
        <div class="src"><a href="${p.u}" target="_blank" rel="noreferrer">${esc(p.t)}</a></div>
      </div>
      <button class="heart" title="선택/해제">${HEART_SVG}</button>
      <button class="note-btn" title="메모">${NOTE_SVG}</button>
      ${tab === 'sel' && noteOf(p.f) ? `<div class="memo"><div class="memo-label">메모</div>${esc(noteOf(p.f))}</div>` : ''}
    </div>`;
  }).join('');
  grid.querySelectorAll('img[data-p]').forEach(img => io.observe(img));
  counts();
}

$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  if (e.target.closest('.heart')) toggle(card.dataset.f);
  else if (e.target.closest('.note-btn')) openMemo(card.dataset.f);
  else if (e.target.closest('.src')) return;
  else if (e.target.tagName === 'IMG') openLb(+e.target.dataset.v);
});

/* ---------- memo ---------- */
let memoTarget = null;
function openMemo(f) {
  memoTarget = f;
  $('memo-text').value = noteOf(f);
  $('memo-modal').classList.add('open');
  $('memo-text').focus();
}
function closeMemo() { $('memo-modal').classList.remove('open'); memoTarget = null; }
function commitMemo(text) {
  const f = memoTarget;
  state.notes[f] = { x: text, t: Date.now() };
  persist();
  schedulePush();
  closeMemo();
  render();
  if (lbIndex >= 0) $('lb-note').classList.toggle('on', !!text);
}
$('memo-save').onclick = () => commitMemo($('memo-text').value.trim());
$('memo-del').onclick = () => commitMemo('');
$('memo-cancel').onclick = closeMemo;
$('memo-modal').addEventListener('click', e => { if (e.target.id === 'memo-modal') closeMemo(); });

/* ---------- cross-device sync via repo state.json ---------- */
const API = 'https://api.github.com/repos/jaeukmoon/wedding-pick/contents/state.json';
let token = null, remoteSha = null, pushTimer = null, pushing = false;

function setSync(msg) { $('sync-status').textContent = msg; }

async function loadToken() {
  try {
    const r = await fetch('token.bin', { cache: 'no-store' });
    if (!r.ok) return;
    token = new TextDecoder().decode(await decryptBuf(await r.arrayBuffer())).trim();
  } catch {}
}

function mergeState(remote) {
  let changed = false, dirty = false;
  for (const kind of ['likes', 'notes']) {
    const L = state[kind], R = (remote && remote[kind]) || {};
    for (const k of new Set([...Object.keys(L), ...Object.keys(R)])) {
      const l = L[k], r = R[k];
      if (l && (!r || l.t > r.t)) dirty = true;
      else if (r && (!l || r.t > l.t)) { L[k] = r; changed = true; }
    }
  }
  return { changed, dirty };
}

async function pullState() {
  if (!token) return;
  try {
    const r = await fetch(API + '?ref=master', {
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      cache: 'no-store' });
    if (r.status === 404) { remoteSha = null; schedulePush(); return; }
    if (!r.ok) { setSync('연결 안 됨 · 이 기기에는 저장됨'); return; }
    const j = await r.json();
    remoteSha = j.sha;
    const bin = Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0));
    const { changed, dirty } = mergeState(JSON.parse(new TextDecoder().decode(bin)));
    if (changed) { persist(); render(); }
    if (dirty) schedulePush(); else setSync('모두 저장됨');
  } catch { setSync('연결 안 됨 · 이 기기에는 저장됨'); }
}

function schedulePush() {
  if (!token) { setSync(''); return; }
  setSync('저장 중...');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushState, 2000);
}

async function pushState() {
  if (!token) return;
  if (pushing) { schedulePush(); return; }
  pushing = true;
  try {
    const bytes = new TextEncoder().encode(JSON.stringify(state));
    let bin = '';
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
    const payload = { message: 'sync', content: btoa(bin), branch: 'master' };
    if (remoteSha) payload.sha = remoteSha;
    const r = await fetch(API, { method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      body: JSON.stringify(payload) });
    if (r.ok) { remoteSha = (await r.json()).content.sha; setSync('모두 저장됨'); }
    else if (r.status === 409 || r.status === 422) {   // someone else pushed first: pull-merge, retry
      await pullState();
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushState, 800);
    }
    else setSync('연결 안 됨 · 이 기기에는 저장됨');
  } catch { setSync('연결 안 됨 · 이 기기에는 저장됨'); }
  pushing = false;
}

async function startSync() {
  await loadToken();
  if (!token) return;
  setSync('동기화 중...');
  await pullState();
  setInterval(pullState, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullState(); });
}

function setTab(t) {
  tab = t;
  $('tab-all').classList.toggle('active', t === 'all');
  $('tab-sel').classList.toggle('active', t === 'sel');
  render();
  window.scrollTo(0, 0);
}
$('tab-all').onclick = () => setTab('all');
$('tab-sel').onclick = () => setTab('sel');

$('btn-clear').onclick = () => {
  const cnt = PHOTOS.filter(p => liked(p.f)).length;
  if (!cnt) return;
  if (confirm(`선택한 ${cnt}장을 모두 해제할까요?`)) {
    const t = Date.now();
    for (const p of PHOTOS) if (liked(p.f)) state.likes[p.f] = { v: 0, t };
    persist(); schedulePush(); render();
  }
};

$('btn-export').onclick = () => {
  const rows = PHOTOS.filter(p => liked(p.f))
    .map((p, i) => `${i + 1}. ${p.f}`
      + (noteOf(p.f) ? `\n   메모: ${noteOf(p.f).replace(/\n/g, '\n         ')}` : '')
      + `\n   후기: ${p.t}\n   ${p.u}`);
  if (!rows.length) { alert('아직 선택한 사진이 없어요.'); return; }
  const blob = new Blob([`페레 스튜디오 — 선택한 시안 ${rows.length}장\n\n` + rows.join('\n\n')],
    { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '페레스튜디오_선택시안.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ---------- lightbox ---------- */
function openLb(vi) {
  lbIndex = vi;
  updateLb();
  $('lightbox').classList.add('open');
}
function closeLb() { $('lightbox').classList.remove('open'); lbIndex = -1; }
function updateLb() {
  const pi = view[lbIndex];
  if (pi === undefined) { closeLb(); return; }
  const p = PHOTOS[pi];
  $('lb-img').removeAttribute('src');
  ensureImg(pi).then(u => { if (view[lbIndex] === pi) $('lb-img').src = u; });
  $('lb-count').textContent = `${lbIndex + 1} / ${view.length}`;
  $('lb-heart').classList.toggle('on', liked(p.f));
  $('lb-note').classList.toggle('on', !!noteOf(p.f));
  $('lb-info').innerHTML = `<a href="${p.u}" target="_blank" rel="noreferrer">${p.t.replace(/</g, '&lt;')}</a>`;
}
$('lb-close').onclick = closeLb;
$('lb-prev').onclick = () => { lbIndex = (lbIndex - 1 + view.length) % view.length; updateLb(); };
$('lb-next').onclick = () => { lbIndex = (lbIndex + 1) % view.length; updateLb(); };
$('lb-heart').onclick = () => {
  const p = PHOTOS[view[lbIndex]];
  toggle(p.f);
  $('lb-heart').classList.toggle('on', liked(p.f));
};
$('lb-note').onclick = () => openMemo(PHOTOS[view[lbIndex]].f);
$('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLb(); });

document.addEventListener('keydown', e => {
  if ($('memo-modal').classList.contains('open')) {
    if (e.key === 'Escape') closeMemo();
    return;
  }
  if (lbIndex < 0) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') $('lb-prev').click();
  else if (e.key === 'ArrowRight') $('lb-next').click();
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('lb-heart').click(); }
});

let touchX = null;
$('lightbox').addEventListener('touchstart', e => touchX = e.touches[0].clientX, { passive: true });
$('lightbox').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) (dx > 0 ? $('lb-prev') : $('lb-next')).click();
  touchX = null;
}, { passive: true });

/* ---------- gate ---------- */
async function submitPw() {
  const pw = $('pw').value;
  if (!pw) return;
  $('pw-btn').disabled = true;
  $('pw-err').textContent = '확인 중...';
  try {
    await unlockWith(pw);
    $('gate').remove();
    render();
    startSync();
  } catch {
    $('pw-err').textContent = '비밀번호가 맞지 않아요';
    $('pw-btn').disabled = false;
  }
}
$('pw-btn').onclick = submitPw;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') submitPw(); });

tryStoredKey().then(ok => {
  if (ok) { $('gate').remove(); render(); startSync(); }
  else $('pw').focus();
});
</script>
</body>
